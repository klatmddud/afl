seed: 42
device: auto
amp: false
output_dir: runs/train

model:
  pretrained: true

data:
  name: ${CIFAR10_NAME}
  presets:
    cifar10:
      name: ${CIFAR10_NAME}
      root: ${CIFAR10_ROOT_DIR}
      download: ${CIFAR10_DOWNLOAD}
    cifar100:
      name: ${CIFAR100_NAME}
      root: ${CIFAR100_ROOT_DIR}
      download: ${CIFAR100_DOWNLOAD}

loader:
  batch_size: 16
  num_workers: 8
  shuffle: true

train:
  epochs: 24
  log_interval: 20
  eval_interval: 1

optimizer:
  type: sgd
  lr: 0.01
  momentum: 0.9
  weight_decay: 0.0005

lr:
  backbone: 0.0001
  classifier: 0.001
  defender: 0.001

scheduler:
  type: cosine
  warmup_epochs: 2
  min_lr: 1e-5
